name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  ci:
    name: vet, staticcheck, test, build
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-alpine

    steps:
      - name: Install tools
        run: apk add --no-cache git

      - name: Checkout
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        # Ref complète plutôt que nom de branche : sur une pull request, c'est
        # refs/pull/N/head, qu'un « clone --branch » ne sait pas récupérer.
        run: |
          git init -q .
          git remote add origin "$(echo "$SERVER_URL" | sed "s|https://|https://oauth2:${TOKEN}@|")/${REPO}.git"
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD

      - name: vet
        run: go vet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -o /dev/null ./cmd/...
